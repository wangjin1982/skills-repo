# React (Create React App) 项目 Netlify 配置

[build]
  command = "npm run build"
  publish = "build"

# SPA 路由支持
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 环境变量（敏感信息请在 Netlify Dashboard 配置）
# 注意: CRA 环境变量必须以 REACT_APP_ 开头
# [build.environment]
#   REACT_APP_API_URL = "https://api.example.com"

# 自定义头部（可选）
# [[headers]]
#   for = "/static/*"
#   [headers.values]
#     Cache-Control = "public, max-age=31536000, immutable"
