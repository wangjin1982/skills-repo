# Next.js 项目 Netlify 配置
# 适用于: Next.js 12+

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 环境变量（敏感信息请在 Netlify Dashboard 配置）
# [build.environment]
#   NODE_ENV = "production"
#   NEXT_PUBLIC_API_URL = "https://api.example.com"

# 自定义头部（可选）
# [[headers]]
#   for = "/*"
#   [headers.values]
#     X-Frame-Options = "DENY"
#     X-XSS-Protection = "1; mode=block"
