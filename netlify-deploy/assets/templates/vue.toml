# Vue.js 项目 Netlify 配置

[build]
  command = "npm run build"
  publish = "dist"

# SPA 路由支持
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 环境变量（敏感信息请在 Netlify Dashboard 配置）
# Vue CLI: 使用 VUE_APP_ 前缀
# Vite: 使用 VITE_ 前缀
# [build.environment]
#   VUE_APP_API_URL = "https://api.example.com"
#   # 或
#   VITE_API_URL = "https://api.example.com"

# 自定义头部（可选）
# [[headers]]
#   for = "/*"
#   [headers.values]
#     X-Frame-Options = "SAMEORIGIN"
